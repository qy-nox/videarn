[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videarn-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "psycopg[binary]>=3.2", "alembic>=1.13",
  "pydantic-settings>=2.6", "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7", "bcrypt<5", "redis>=5.0", "celery>=5.4",
  "firebase-admin>=6.5", "httpx>=0.27", "pytest>=8.3",
  "pytest-asyncio>=0.24", "aiosqlite>=0.20"
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
include = ["app*"]
